<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>キャラクター診断 | キャラクター一覧</title>
	
	<link rel="stylesheet" th:href="@{css/normalize.css}" href="../../../resources/static/css/normalize.css">
	<link rel="stylesheet" th:href="@{css/diagnosis/style.css}" href="../../../resources/static/css/diagnosis/style.css">
	
</head>
<body>
	<head>
		<meta charset="UTF-8">
		<!-- スマホ表示用：画面幅に合わせる -->
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>キャラクター診断 | キャラクター一覧</title>

		<!-- 共通のリセットCSS -->
		<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../static/css/normalize.css">

		<!-- 診断ページ共通のCSS -->
		<link rel="stylesheet" th:href="@{/css/diagnosis/style.css}" href="../../static/css/diagnosis/style.css">

		<!-- このページ専用のCSS（必ず style.css より後ろに書く＝後勝ちで上書きできる） -->
		<link rel="stylesheet" th:href="@{/css/test/testcharacters.css}" href="../../static/css/test/testcharacters.css">
	</head>

	<!-- page-characters を付けると、背景CSSがこのページだけに効く -->
	<body class="page-characters">
	<body class="page-characters">
	<div class="screen">
		<header>
			<img class="titlelogo" src="../../static/images/diagnosis/title.png">
			<h1 class="title">キャラクター一覧</h1>
		</header>
		
		<main class="main-column">
			<div class="card" th:each="character : ${characterList}">
				<div class="thumb">
					<img th:src="@{${character.characterImagePath}}" alt="キャラ画像">
				</div>
				<div class="info">
					<p class="name" th:text="${character.familyName}+' '+${character.firstName}">キャラクター名</p>
					<div class="desc">
						<span th:text="${character.description}">キャラ説明文</span>
					</div>
				</div>
			</div>
			
		</main>
		
		<!-- フッター：画像ではなく文字の「TOP」リンクにする -->
		<footer class="footer">
			<a class="top-link" th:href="@{/}" href="#">TOP</a>
		</footer>
	</div>
</body>
</html>
