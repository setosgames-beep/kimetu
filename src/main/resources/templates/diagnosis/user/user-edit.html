<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>ユーザー編集</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" th:href="@{/css/diagnosis/style.css}">
</head>

<body>

    <div class="screen">

        <header>
            <p class="icon">鬼滅の刃<br>キャラクター診断</p>
        </header>

        <main>

            <h1>ユーザー編集</h1>

            <div>
                <label for="username">名前</label>
                <input type="text"
                       id="username"
                       name="username"
                       th:value="${user.username}">
            </div>

            <div>
                <p>診断結果</p>
                <p>竈門炭治郎</p>
            </div>

            <div>
                <label for="favorite">プロフィール・自由記入欄</label>
                <textarea id="favorite"
                          name="favorite"
                          rows="10"
                          placeholder="自己紹介や、感想など、自由に書いてください♪"></textarea>
            </div>

            <button type="submit">保存する</button>

        </main>

    </div>

</body>
</html>
