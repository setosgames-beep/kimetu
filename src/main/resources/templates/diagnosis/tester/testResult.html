<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<!-- スマホ表示用：画面幅に合わせる -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>診断結果</title>

	<!-- Google Fonts（キャラクター一覧と同じフォント） -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

	<!-- 共通CSS -->
	<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../../static/css/normalize.css">
	<link rel="stylesheet" th:href="@{/css/diagnosis/style.css}" href="../../../static/css/diagnosis/style.css">

	<!-- このページ専用のCSS（style.css より後ろに書く） -->
	<link rel="stylesheet" th:href="@{/css/test/testResult.css}" href="../../../static/css/test/testResult.css">
</head>

<!-- page-result を付けると、専用CSSがこのページだけに効く -->
<body class="page-result">

	<div class="screen nav">

		<!-- ===== ヘッダー：ロゴは左上、タイトルは真ん中 ===== -->
		<header class="nav-com">
			<!-- ロゴをクリックするとTOPへ -->
			<a href="index.html" th:href="@{/}">
				<img class="title-logo"
				     src="../../../static/images/diagnosis/title.png"
				     th:src="@{/images/diagnosis/title.png}" alt="TOPへ">
			</a>
			<h1 class="title">診断結果</h1>
		</header>

		<!-- ===== メイン：左にキャラ画像、右に診断結果 ===== -->
		<main class="result-main">
			<!-- ${character} は Controller から渡す診断結果のキャラ（1人分） -->
			<div class="result-layout">

				<!-- 左：キャラクター画像（縦長の枠） -->
				<div class="result-image">
					<img th:src="@{${character.characterImagePath}}"
					     src="../../../static/images/diagnosis/test/tanjiro.png" alt="キャラ画像">
				</div>

				<!-- 右：診断結果 -->
				<section class="result-box">
					<p class="lead">あなたにいちばん近いキャラは…</p>

					<!-- キャラ名（苗字 + 名前） -->
					<p class="result-name"
					   th:text="${character.familyName}+' '+${character.firstName}">竈門 炭治郎</p>

					<!-- 相性：matchRate が渡されたときだけ表示（無ければ丸ごと非表示） -->
					<div class="match" th:if="${matchRate != null}">
						<p class="match-text">相性 <strong th:text="${matchRate}">92</strong>%</p>
						<div class="bar"><span th:style="'width:' + ${matchRate} + '%'" style="width:92%"></span></div>
					</div>

					<!-- キャラの説明文 -->
					<p class="result-desc" th:text="${character.description}">キャラ説明文</p>

					<!-- 次の行動へのボタン -->
					<div class="btn-row">
						<a class="btn btn-main" th:href="@{/questions}" href="#">もう一度診断する</a>
						<a class="btn btn-sub"  th:href="@{/characters}" href="#">キャラ一覧へ</a>
					</div>
				</section>

			</div>
		</main>

		<!-- ===== フッター：TOPリンクとコピーライト ===== -->
		<footer class="footer">
			<a class="top-link" th:href="@{/}" href="index.html">TOP</a>
			<p class="copyright"><small>&copy;Copyright 2026 304_メタモン</small></p>
		</footer>

	</div>
</body>
</html>
