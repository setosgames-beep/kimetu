```html
<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>キャラクター診断 | 最後の質問</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          th:href="@{/css/normalize.css}">

    <link rel="stylesheet"
          th:href="@{/css/diagnosis/style.css}">
</head>

<body>

<div class="screen">

    <header>
        <!-- 有木：診断TOPへ戻るためのロゴ -->
        <a th:href="@{/test}">
            <img class="title-logo"
                 th:src="@{/images/diagnosis/title.png}"
                 alt="TOPへ">
        </a>

        <h1 class="title">最後の質問</h1>
    </header>


    <main>

        <!-- 有木：同点だったキャラクターを決めるための最終質問 -->
        <div class="question">

            <!-- 有木：16問目の質問文をDBから表示する -->
            <h2 class="question-title"
                th:text="${question.body}">
                最後の質問！あなたが一番大切にしたい気持ちは？
            </h2>


            <!-- 有木：最終質問で選択できるキャラクターの選択肢を表示する -->
            <form th:action="@{/test/diagnosis/final}"
                  method="post">

                <!-- 有木：同点キャラクターに対応した選択肢だけを表示する -->
                <div th:each="choice : ${choices}">

                    <label class="choice">

                        <!-- 有木：選んだ最終回答のchoice.idをControllerへ送る -->
                        <input type="radio"
                               name="choiceId"
                               th:value="${choice.id}"
                               required>

                        <!-- 有木：DBに登録した最終質問の選択肢文章を表示する -->
                        <span th:text="${choice.body}">
                            誰かの痛みに寄り添って、あきらめずに前へ進む気持ち
                        </span>

                    </label>

                </div>

                <button type="submit">結果を見る</button>

            </form>

        </div>

    </main>


    <footer class="footer">

        <a th:href="@{/}">
            <img src="../../../static/images/logo.png"
                 th:src="@{/images/logo.png}"
                 alt="TOPへ">
        </a>

        <p class="copyright">
            <small>&copy;Copyright 2026 304_メタモン</small>
        </p>

    </footer>

</div>

</body>
</html>
