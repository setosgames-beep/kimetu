<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>キャラクター診断 | 質問選択</title>

	<!-- normalize.css -->
	<link rel="stylesheet"
		  th:href="@{/css/normalize.css}"
		  href="../../../resources/static/css/normalize.css">

	<!-- 共通CSS -->
	<link rel="stylesheet"
		  th:href="@{/css/diagnosis/style.css}"
		  href="../../../resources/static/css/diagnosis/style.css">

	<!-- キャラクター一覧ページ専用CSS -->
	<link rel="stylesheet"
		  th:href="@{/css/test/testquestions.css}"
		  href="../../../resources/static/css/test/testquestions.css">
</head>

<body class="page-characters">

	<div class="screen">

		<header>

			<!-- 左側：ロゴ -->
			<img
				class="title-logo"
				th:src="@{/images/diagnosis/title.png}"
				src="../../static/images/diagnosis/title.png"
				alt="鬼滅の刃診断">

			<!-- 中央：タイトル -->
			<h1 class="title">質問選択</h1>

		</header>

		<!-- ============================================
			 質問エリア
			 ============================================ -->

		<main class="main-column">
			
			<form th:action="@{/diagnosis/submit}" th:object="${diagnosisForm}" method="post">
				
				<!-- 質問1 -->
				<section class="question" th:each="entry : ${map}">
					
					<h2 class="question-title">
						<span th:text="${entry.key.body}">質問 1</span>
					</h2>
					
					<div class="choices">
	
						<label class="choice" th:each="choice : ${entry.value}">
							<input type="radio"
									th:fieald="*{selectedChoiceIds}"
									th:value="${choice.id}" requried />
							<span th:text="${choice.body}">A</span>
						</label>
					</div>
	
				</section>
				
			</form>
			

			<!-- 診断ボタン -->
			<div class="button-area">

				<button type="submit"
						class="diagnosis-button">
					診断する
				</button>

			</div>

		</main>

		<footer class="footer">

			<a
				class="top-link"
				th:href="@{/}"
				href="index.html">

				TOP

			</a>

		</footer>

	</div>

</body>

</html>
