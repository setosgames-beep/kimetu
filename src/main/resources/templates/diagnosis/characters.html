<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<!-- 文字コード（直接ファイルを開いたときの文字化け防止） -->
	<meta charset="UTF-8">
	<!-- スマホ表示用：画面幅に合わせる -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>キャラクター診断 | キャラクター一覧</title>

	<!-- ===== Google Fonts(キャラクター一覧のフォント) ===== -->
	<!-- 外部サーバーへの接続を先に準備して、表示を速くする -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<!-- 使うフォント:名前=Zen Antique / 説明文=Shippori Mincho -->
	<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

	<!-- 共通CSS（th:href の先頭に / を付けると、どの階層のURLでも読み込める） -->
	<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../static/css/normalize.css">
	<link rel="stylesheet" th:href="@{/css/diagnosis/style.css}" href="../../static/css/diagnosis/style.css">

	<!-- このページ専用のCSS（必ず style.css より後ろに書く＝後勝ちで上書きできる） -->
	<link rel="stylesheet" th:href="@{/css/test/testcharacters.css}" href="../../static/css/test/testcharacters.css">
</head>

<!-- page-characters を付けると、背景CSSがこのページだけに効く -->
<body class="page-characters">
	<div class="screen">

		<!-- ===== ヘッダー：ロゴは左上、タイトルは真ん中 ===== -->
		<header>
			<img class="titlelogo"
			     src="../../static/images/diagnosis/title.png"
			     th:src="@{/images/diagnosis/title.png}" alt="キャラクター診断">
			<h1 class="title">キャラクター一覧</h1>
		</header>

		<!-- ===== メイン：キャラのカードを1人ずつ表示 ===== -->
		<main class="main-column">
			<div class="card" th:each="character : ${characterList}">
				<div class="thumb">
					<!-- characterImagePath は「/images/...」から始まるパスにする -->
					<img th:src="@{${character.characterImagePath}}"
					     th:alt="${character.familyName}+' '+${character.firstName}" alt="キャラ画像">
				</div>
				<div class="info">
					<p class="name" th:text="${character.familyName}+' '+${character.firstName}">キャラクター名</p>
					<div class="desc">
						<span th:text="${character.description}">キャラ説明文</span>
					</div>
				</div>
			</div>
		</main>

		<!-- ===== フッター：文字の「TOP」リンクとコピーライト ===== -->
		<footer class="footer">
			<a class="top-link" th:href="@{/}" href="index.html">TOP</a>
			<p class="copyright"><small>&copy;Copyright 2026 304_メタモン</small></p>
		</footer>

	</div>
</body>
</html>
