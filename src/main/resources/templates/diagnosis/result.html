<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>診断結果</title>
</head>
<body>
	<h1>診断結果</h1>

	<div th:if="${#lists.isEmpty(results)}">
		<p>診断結果が見つかりませんでした。</p>
	</div>

	<ul th:unless="${#lists.isEmpty(results)}">
		<li th:each="r : ${results}">
			<img th:src="@{${characters[r.characterId].resultImagePath}}" alt="キャラクター画像" width="200">
			<h2>
				<span th:text="${characters[r.characterId].familyName}">竈門</span>
				<span th:text="${characters[r.characterId].firstName}">炭治郎</span>
			</h2>
			<p th:text="${characters[r.characterId].descriptionResult}">診断結果の説明文</p>
			診断日時：<span th:text="${#temporals.format(r.diagnosedAt, 'yyyy/MM/dd HH:mm')}">2026/10/06 14:00</span>
		</li>
	</ul>

	<a th:href="@{/}">トップへ戻る</a>
</body>
</html>
