<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>ユーザー一覧</title>
</head>
<body>
	<h1>ユーザー一覧</h1>

	<p th:if="${#lists.isEmpty(users)}">ユーザーがいません。</p>

	<div th:each="u : ${users}" style="border:1px solid #ccc; padding:10px; margin:10px 0;">
		<h2 th:text="${u.name}">ユーザー名</h2>
		<p th:text="${u.body}">自己紹介等（自由記入欄）</p>
		<p>診断結果：<span th:text="${u.diagnosisResult}">竈門 炭治郎</span></p>

		<a th:href="@{/users/{id}/edit(id=${u.id})}">ユーザー編集</a>

		<form th:action="@{/users/{id}/delete(id=${u.id})}" method="post" style="display:inline;"
		      onsubmit="return confirm('削除しますか？');">
			<button type="submit">削除</button>
		</form>
	</div>
</body>
</html>
