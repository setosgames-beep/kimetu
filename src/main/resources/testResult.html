<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<!-- スマホ表示用：画面幅に合わせる -->
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>診断結果</title>

	<!-- Google Fonts（キャラクター一覧と同じフォント） -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Antique&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">

	<!-- 共通CSS（先頭に / を付けると、どの階層のURLでも読み込める） -->
	<link rel="stylesheet" th:href="@{/css/normalize.css}" href="../../static/css/normalize.css">
	<link rel="stylesheet" th:href="@{/css/diagnosis/style.css}" href="../../static/css/diagnosis/style.css">

	<!-- ★ このページ専用のCSS（これが抜けていたので反映されなかった）。style.css より後ろに書く -->
	<link rel="stylesheet" th:href="@{/css/test/testResult.css}" href="../../static/css/test/testResult.css">
</head>

<!-- ★ page-result を付けると、専用CSSがこのページだけに効く -->
<body class="page-result">

	<div class="screen nav">
		<!-- ★ <header class=...> の間が全角スペースになっていたので半角に直した -->
		<header class="nav-com">
			<!-- ロゴをクリックするとTOPへ -->
			<a href="index.html" th:href="@{/}">
				<img class="title-logo"
				     src="../../static/images/diagnosis/title.png"
				     th:src="@{/images/diagnosis/title.png}" alt="TOPへ">
			</a>
			<h1 class="title">診断結果</h1>
		</header>

		<main class="main-column">
			<!-- 診断結果のキャラを1件ずつカードで表示 -->
			<div class="card" th:each="character : ${characterList}">
				<div class="thumb">
					<img th:src="@{${character.characterImagePath}}" alt="キャラ画像">
				</div>
				<div class="info">
					<p class="name" th:text="${character.familyName}+' '+${character.firstName}">キャラクター名</p>
					<div class="desc">
						<span th:text="${character.description}">キャラ説明文</span>
					</div>
				</div>
			</div>
		</main>

		<footer class="footer">
			<!-- TOPへ戻るリンク（文字リンク：画像が無くても必ず表示される） -->
			<a class="top-link" th:href="@{/}" href="index.html">TOP</a>
			<p class="copyright"><small>&copy;Copyright 2026 304_メタモン</small></p>
		</footer>
	</div>
</body>
</html>
